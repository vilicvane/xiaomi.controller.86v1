# User-authorized brief CPU0 halt/resume only, through the existing generic MEM-AP.
# No Cortex-A target examination, ITR/DTR transfer, DSCR write, core injection,
# RAM/Flash/cache/clock/reset/display operation. Never use MCU DHCSR for this A7.
# Root owns execution. This file was prepared and reviewed offline.
# Expected observed view: Cortex-A7 r0p5, both Software/OS Locks initially set.
# Nominal halt/resume budget <1 second; individual adapter failures can exceed it.
if {![info exists a7_result_path]} { set a7_result_path "diagnostics/a7-halt-resume-probe-result.txt" }
set a7_result [open $a7_result_path w]
set a7_begin_ms [clock milliseconds]
set a7_track_power 0
set a7_power_event 0
set a7_original_saved 0
set a7_lar_write_possible 0
set a7_oslar_write_possible 0
set a7_hrq_write_possible 0
set a7_rrq_write_possible 0
set a7_halt_observed 0
set a7_resume_observed 0
set a7_pending_hrq_uncertain 0
set a7_locks_restored 0
set a7_probe_verified 0
set a7_moe_unexpected 0
set a7_write_count 0
set a7_control_mask 0x0030fc00
set a7_mutation_begin_ms 0
set a7_halt_observed_ms 0
set a7_resume_observed_ms 0

proc a7_log {message} { global a7_result; puts $a7_result $message }
proc a7_word {address} { return [expr {[lindex [read_memory $address 32 1] 0] + 0}] }
proc a7_prsr {} {
    global a7_track_power a7_power_event
    set value [a7_word 0x58050314]
    if {$a7_track_power} {
        # PU loss is represented by software bit8; retain every sticky event.
        if {($value & 1) == 0} { set a7_power_event [expr {$a7_power_event | 0x100}] }
        set a7_power_event [expr {$a7_power_event | ($value & 0x4e)}]
    }
    return $value
}
proc a7_stable {value} {
    global a7_power_event
    if {$a7_power_event || ($value & 1) == 0 || ($value & 0x44)} {
        error [format "Power/reset/double-lock event; PRSR=0x%08x latched=0x%03x" $value $a7_power_event]
    }
}
proc a7_put {address value flag_name} {
    global a7_write_count
    upvar #0 $flag_name possible
    # A failed transport can already have committed the target write.
    set possible 1
    incr a7_write_count
    a7_log [format "write_possible_%02d 0x%08x 0x%08x" $a7_write_count $address $value]
    write_memory $address 32 [list $value]
}
proc a7_running_controls {dscr} {
    global a7_control_mask a7_original_dscr
    if {$dscr & 1} { error "A7 unexpectedly already halted" }
    if {($dscr & $a7_control_mask) != ($a7_original_dscr & $a7_control_mask)} {
        error "A7 debug controls changed concurrently"
    }
}
proc a7_mark_halted {} {
    global a7_halt_observed a7_halt_observed_ms
    if {!$a7_halt_observed} { set a7_halt_observed_ms [clock milliseconds] }
    set a7_halt_observed 1
}
proc a7_wait_halt {timeout_ms} {
    set start [clock milliseconds]
    # Count also bounds a backwards wall-clock adjustment; no intentional sleep.
    for {set i 0} {$i < 48} {incr i} {
        set dscr [a7_word 0x58050088]
        if {$dscr & 1} { a7_mark_halted }
        set prsr [a7_prsr]
        a7_stable $prsr
        if {($dscr & 1) && ($prsr & 0x10)} { return $dscr }
        if {[clock milliseconds] - $start >= $timeout_ms} { break }
    }
    error "Halt was not observed within bounded poll; HRQ has no proven cancellation"
}
proc a7_resume_halted {} {
    global a7_control_mask a7_original_dscr a7_resume_observed
    global a7_resume_observed_ms a7_moe_unexpected
    # No ITR/DTR transfer happened: do not read/write PC/CPSR or replay context.
    set dscr [a7_word 0x58050088]
    if {$dscr & 1} { a7_mark_halted }
    set prsr [a7_prsr]
    a7_stable $prsr
    if {($dscr & 1) == 0 || ($prsr & 0x10) == 0} { error "Resume gate: halt not confirmed by both status registers" }
    if {($dscr & 0x01000000) == 0 || ($dscr & 0x2000)} { error "Resume gate: InstrCompl not set or ITRen set" }
    if {($dscr & $a7_control_mask) != ($a7_original_dscr & $a7_control_mask)} { error "Resume gate: debug controls changed concurrently" }
    set moe [expr {($dscr >> 2) & 15}]
    if {$moe != 0} { set a7_moe_unexpected 1 }
    a7_log [format "halt_dscr 0x%08x halt_prsr 0x%08x moe %d sticky_exceptions 0x%03x" $dscr $prsr $moe [expr {$dscr & 0x1c0}]]
    # RRQ+CSE matches OpenOCD. Never set Cancel Bus Requests (bit4).
    a7_put 0x58050090 6 a7_rrq_write_possible
    set start [clock milliseconds]
    for {set i 0} {$i < 48} {incr i} {
        set dscr [a7_word 0x58050088]
        set prsr [a7_prsr]
        a7_stable $prsr
        if {($dscr & 3) == 2 && ($prsr & 0x10) == 0} {
            set a7_resume_observed 1
            set a7_resume_observed_ms [clock milliseconds]
            a7_log [format "resume_dscr 0x%08x resume_prsr 0x%08x" $dscr $prsr]
            return
        }
        if {[clock milliseconds] - $start >= 200} { break }
    }
    error "Resume not confirmed; preserve unlocked diagnostic access"
}
proc a7_restore_locks {} {
    global a7_oslar_write_possible a7_lar_write_possible a7_locks_restored
    global a7_original_lsr a7_original_oslsr a7_hrq_write_possible
    global a7_halt_observed a7_pending_hrq_uncertain
    set prsr [a7_prsr]
    a7_stable $prsr
    set dscr [a7_word 0x58050088]
    if {($dscr & 1) || ($prsr & 0x10)} { error "Refuse relock while CPU remains halted" }
    if {$a7_pending_hrq_uncertain || ($a7_hrq_write_possible && !$a7_halt_observed)} {
        error "Refuse relock: an unobserved pending HRQ cannot be excluded"
    }
    if {$a7_oslar_write_possible} {
        if {$a7_original_oslsr & 2} { set os_value 0xc5acce55 } else { set os_value 0 }
        a7_put 0x58050300 $os_value a7_oslar_write_possible
        set oslsr [a7_word 0x58050304]
        if {($oslsr & 2) != ($a7_original_oslsr & 2)} { error "OS Lock restoration mismatch" }
        # Check the live power/reset latch before access is software-locked again.
        a7_stable [a7_prsr]
        if {[a7_word 0x58050088] & 1} { error "A7 halted during lock restoration; keep Software Lock clear" }
    }
    if {$a7_lar_write_possible} {
        if {$a7_original_lsr & 2} { set lar_value 0 } else { set lar_value 0xc5acce55 }
        a7_put 0x58050fb0 $lar_value a7_lar_write_possible
        set lsr [a7_word 0x58050fb4]
        if {($lsr & 3) != ($a7_original_lsr & 3)} { error "Software Lock restoration mismatch" }
    }
    set a7_locks_restored 1
}

a7_log "scope CPU0 pure halt/immediate resume; only LAR/OSLAR/DRCR writes; no deliberate hold"
set a7_test_error [catch {
    source [find swd-memory.cfg]
    adapter speed 1000
    init
    set a7_didr [a7_word 0x58050000]
    set a7_midr [a7_word 0x58050d00]
    set a7_original_ecr [a7_word 0x58050024]
    set a7_original_lsr [a7_word 0x58050fb4]
    set a7_original_oslsr [a7_word 0x58050304]
    set a7_auth [a7_word 0x58050fb8]
    set a7_original_dscr [a7_word 0x58050088]
    set a7_original_prsr [a7_prsr]
    set a7_original_saved 1
    foreach name {didr midr original_ecr original_lsr original_oslsr auth original_dscr original_prsr} {
        a7_log [format "%s 0x%08x" $name [set a7_$name]]
    }
    if {$a7_didr != 0x3515f005 || $a7_midr != 0x410fc075} { error "A7 component identity differs from reviewed component" }
    if {($a7_original_lsr & 7) != 3 || ($a7_original_oslsr & 15) != 10} { error "Initial lock view differs; preserve it without mutation" }
    if {($a7_auth & 255) != 255 || ($a7_original_ecr & 1)} { error "Authentication/OS Unlock Catch gate failed" }
    if {($a7_original_prsr & 1) == 0 || ($a7_original_prsr & 0x54)} { error "Initial power/reset/halt/double-lock gate failed" }
    if {($a7_original_dscr & 1) || ($a7_original_dscr & $a7_control_mask) || ($a7_original_dscr & 0x1c0)} { error "Initial running/debug-control gate failed" }
    # Running InstrCompl bit24 is UNKNOWN: deliberately not used as a gate.
    set a7_mutation_begin_ms [clock milliseconds]
    a7_put 0x58050fb0 0xc5acce55 a7_lar_write_possible
    set a7_lsr [a7_word 0x58050fb4]
    if {($a7_lsr & 7) != 1} { error "Software Lock unlock was ignored or differs; no OS unlock/HRQ issued" }
    # Software Lock suppresses PRSR read-clear. Record then acknowledge history.
    set a7_historic_prsr [a7_prsr]
    set a7_baseline_prsr [a7_prsr]
    a7_log [format "historic_after_lar_prsr 0x%08x live_baseline_prsr 0x%08x" $a7_historic_prsr $a7_baseline_prsr]
    if {($a7_baseline_prsr & 1) == 0 || ($a7_baseline_prsr & 0x5e)} { error "Cannot establish clean powered/running PRSR baseline" }
    set a7_track_power 1
    a7_put 0x58050300 0 a7_oslar_write_possible
    set a7_oslsr [a7_word 0x58050304]
    set a7_prsr_value [a7_prsr]
    a7_stable $a7_prsr_value
    if {($a7_oslsr & 15) != 8 || ($a7_prsr_value & 0x20)} { error "OS Lock unlock failed" }
    if {([a7_word 0x58050fb8] & 255) != 255 || ([a7_word 0x58050024] & 1)} { error "Authentication/Unlock Catch changed" }
    set a7_dscr [a7_word 0x58050088]
    a7_stable [a7_prsr]
    a7_running_controls $a7_dscr
    if {[clock milliseconds] - $a7_mutation_begin_ms >= 250} { error "Pre-halt transport exceeded bounded timing gate; no HRQ issued" }
    a7_put 0x58050090 1 a7_hrq_write_possible
    a7_wait_halt 150
    # Immediately resume: no host sleep, framebuffer access, or core transfer.
    a7_resume_halted
    if {$a7_moe_unexpected} { error "A7 entered via a concurrent method; resumed but probe is not clean HRQ evidence" }
    set a7_probe_verified 1
} a7_test_message]

# Explicit finally path. A possible partial write is treated as a real write.
set a7_cleanup_error [catch {
    if {$a7_original_saved && ($a7_lar_write_possible || $a7_oslar_write_possible || $a7_hrq_write_possible)} {
        set prsr [a7_prsr]
        a7_stable $prsr
        set dscr [a7_word 0x58050088]
        if {$dscr & 1} { a7_mark_halted }
        if {($dscr & 1) || ($prsr & 0x10)} {
            a7_resume_halted
        } elseif {$a7_hrq_write_possible && !$a7_halt_observed} {
            # No DRCR cancellation exists. Catch a late halt once, bounded.
            set late_start [clock milliseconds]
            set late_halt 0
            for {set i 0} {$i < 48} {incr i} {
                set dscr [a7_word 0x58050088]
                if {$dscr & 1} { a7_mark_halted }
                set prsr [a7_prsr]
                a7_stable $prsr
                if {($dscr & 1) && ($prsr & 0x10)} { set late_halt 1; break }
                if {[clock milliseconds] - $late_start >= 200} { break }
            }
            if {$late_halt} {
                a7_resume_halted
            } else {
                set a7_pending_hrq_uncertain 1
                error "Unresolved possible pending HRQ: keep debug access unlocked; rollback incomplete"
            }
        }
        a7_restore_locks
        set a7_final_prsr [a7_prsr]
        a7_stable $a7_final_prsr
        set a7_final_dscr [a7_word 0x58050088]
        a7_running_controls $a7_final_dscr
        if {($a7_final_prsr & 0x10) || ([a7_word 0x58050304] & 2) != ($a7_original_oslsr & 2) || ([a7_word 0x58050fb4] & 3) != ($a7_original_lsr & 3)} {
            error "Final running/lock verification failed"
        }
        a7_log [format "final_dscr 0x%08x final_prsr 0x%08x" $a7_final_dscr $a7_final_prsr]
    } else {
        # Preflight failed before any possible target write.
        set a7_locks_restored 1
    }
} a7_cleanup_message]

# Only read observation after failure; never silently reset, inject, or relock.
if {$a7_cleanup_error} {
    foreach {label address} {failure_dscr 0x58050088 failure_prsr 0x58050314 failure_oslsr 0x58050304 failure_lsr 0x58050fb4} {
        set observation_error [catch {
            if {$address == 0x58050314} { set value [a7_prsr] } else { set value [a7_word $address] }
            a7_log [format "%s 0x%08x" $label $value]
        } observation_message]
        if {$observation_error} { a7_log "$label unreadable: $observation_message" }
    }
}
set a7_elapsed_ms [expr {[clock milliseconds] - $a7_begin_ms}]
set a7_mutation_elapsed_ms 0
if {$a7_mutation_begin_ms} { set a7_mutation_elapsed_ms [expr {[clock milliseconds] - $a7_mutation_begin_ms}] }
set a7_observed_halt_ms -1
if {$a7_halt_observed_ms && $a7_resume_observed_ms} { set a7_observed_halt_ms [expr {$a7_resume_observed_ms - $a7_halt_observed_ms}] }
foreach name {lar_write_possible oslar_write_possible hrq_write_possible rrq_write_possible halt_observed resume_observed pending_hrq_uncertain power_event locks_restored probe_verified moe_unexpected write_count elapsed_ms mutation_elapsed_ms observed_halt_ms test_error cleanup_error} {
    a7_log "$name [set a7_$name]"
}
a7_log "test_message $a7_test_message"
a7_log "cleanup_message $a7_cleanup_message"
close $a7_result
echo "A7_HALT_RESUME: verified=$a7_probe_verified halted=$a7_halt_observed resumed=$a7_resume_observed locks_restored=$a7_locks_restored pending_uncertain=$a7_pending_hrq_uncertain power_event=$a7_power_event observed_halt_ms=$a7_observed_halt_ms"
if {$a7_cleanup_error} { error "A7 cleanup incomplete: $a7_cleanup_message" }
if {$a7_test_error} { error "A7 probe failed after cleanup: $a7_test_message" }
echo "A7_PURE_HALT_RESUME_AND_LOCK_RESTORE_COMPLETE"
shutdown
