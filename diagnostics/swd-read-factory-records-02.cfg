source [find swd-memory.cfg]
adapter speed 1000
init
# Actual /dev/misc_etc MTD partition recovered from this firmware's table:
# start block 0xfe00, 64 blocks, 256 bytes per block, NOR base 0x28000000.
# Pure memory read only; no CPU halt/reset or target-memory writes.
echo "FACTORY_RECORDS [dump_image backups/misc-etc-factory-read02.bin 0x28fe0000 0x4000]"
shutdown
