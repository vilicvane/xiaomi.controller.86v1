# Read-only retained panel_apps brightness state; no policy or pixel changes.
source [find swd-memory.cfg]
adapter speed 1000
init
echo "COUNTER_FIRMWARE_ENTRY [read_memory 0x28ccdcc8 32 1]"
echo "BACKLIGHT_CURRENT_GATE_TIMER [read_memory 0x384ea634 32 3]"
echo "BACKLIGHT_TARGET [read_memory 0x384ea5e0 32 1]"
echo "BACKLIGHT_IOCTL_FD [read_memory 0x384ea600 32 1]"
echo "SCREEN_TIMER_FD_PERIOD_AUTOREST_FLAGS [read_memory 0x384ea610 32 4]"
echo "BACKLIGHT_PWM_CONFIG [read_memory 0x384e9fe4 8 8]"
echo "BACKLIGHT_PWM6_ENABLE [read_memory 0x40089004 32 1]"
echo "BACKLIGHT_PWM6_BREATH [read_memory 0x4008902c 32 1]"
shutdown
