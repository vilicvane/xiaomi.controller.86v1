source [find swd-memory.cfg]
adapter speed 50
init
# These memory addresses come from the BES best2003 reference linker script.
# Read bounded samples only; the panel's total Flash size is not established.
echo "FLASH_NONCACHE [bes.mem mdw 0x28000000 8]"
echo "FLASH_CACHE [bes.mem mdw 0x2c000000 8]"
echo "RAM_VECTORS [bes.mem mdw 0x20000000 8]"
dump_image diagnostics/flash-head-4k.bin 0x28000000 0x1000
dump_image diagnostics/ram-vectors-256.bin 0x20000000 0x100
shutdown
