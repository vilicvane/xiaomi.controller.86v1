# Read-only candidate A7 debug ROM/component identity; no cortex_a examine.
source [find swd-memory.cfg]
adapter speed 1000
init
echo "A7_ROM_CID [bes.mem mdw 0x58040ff0 4]"
echo "A7_ROM_PID [bes.mem mdw 0x58040fd0 8]"
dump_image backups/display-takeover/a7-debug-rom-first64.bin 0x58040000 0x40
echo "A7_CPU0_CID [bes.mem mdw 0x58050ff0 4]"
echo "A7_CPU0_PID [bes.mem mdw 0x58050fd0 8]"
shutdown
