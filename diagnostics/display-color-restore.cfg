source [find swd-memory.cfg]
adapter speed 1000
init
write_memory 0x58100124 32 {0x00000000}
set control [lindex [read_memory 0x58100260 32 1] 0]
write_memory 0x58100260 32 [list [expr {($control & ~0x01000000) | 0x00000000}]]
echo "RESTORED_COLOR [bes.mem mdw 0x58100124 1]"
echo "RESTORED_CONTROL [bes.mem mdw 0x58100260 1]"
shutdown
