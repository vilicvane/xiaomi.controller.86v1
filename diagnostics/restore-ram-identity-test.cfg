# Restore only after reviewing post-test state. The firmware's own online
# activity, if any, is not undone by this byte restoration.
source [find swd-memory.cfg]
adapter speed 1000
init
set panel_identity_initialized [lindex [read_memory 0x3401d2c0 8 1] 0]
if {$panel_identity_initialized != 0} {
    echo "STOP: normal initialization completed; re-evaluate before restore"
} else {
    echo "RESTORE_DID [load_image backups/ram-identity-test-candidate/preflight-did-buffer.bin 0x34000844 bin]"
    echo "RESTORE_KEY [load_image backups/ram-identity-test-candidate/preflight-key-buffer.bin 0x34000870 bin]"
    dump_image backups/ram-identity-test-candidate/restored-did-buffer.bin 0x34000844 0x20
    dump_image backups/ram-identity-test-candidate/restored-key-buffer.bin 0x34000870 0x20
}
shutdown
