source [find swd-memory.cfg]
adapter speed 1000
init
# FLASH_BASE and FLASH_SIZE were read from this panel's boot build information.
# Generic MEM-AP read only; no Flash driver, RAM payload, CPU halt or reset.
echo "FLASH_BACKUP [dump_image backups/mi-panel-flash-16m-20261003.bin 0x28000000 0x1000000]"
shutdown
