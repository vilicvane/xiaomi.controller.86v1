source [find swd-memory.cfg]
adapter speed 1000
init
set head [lindex [read_memory 0x384fcbdc 32 1] 0]
set tail [lindex [read_memory 0x384fcbe0 32 1] 0]
echo "INPUT_HEAD_LINKS [read_memory [expr {$head+0x78}] 32 6]"
echo "INPUT_TAIL_LINKS [read_memory [expr {$tail+0x78}] 32 6]"
echo "INPUT_TAIL_DRIVER [read_memory $tail 32 1]"
shutdown
