# Native application source buffer only; no writes, CPU halt, or reset.
source [find swd-memory.cfg]
adapter speed 1000
init
set counter_source [expr {[lindex [read_memory 0x384ef8b8 32 1] 0]+0}]
if {$counter_source < 0x38600000 || $counter_source > 0x38f6a000 || ($counter_source & 3)} {
    error "Native source pointer is outside the reviewed A7 heap range"
}
echo [format "OWNED_SOURCE 0x%08x" $counter_source]
for {set sample 0} {$sample < 3} {incr sample} {
    set live_source [expr {[lindex [read_memory 0x384ef8b8 32 1] 0]+0}]
    if {$live_source != $counter_source} { error "Display source changed; stop color sampling" }
    dump_image [format "analysis/display-takeover/native-colors-%d.bin" $sample] [expr {$counter_source+140*480*4}] 61440
    if {$sample != 2} { sleep 1000 }
}
shutdown
