source [find swd-memory.cfg]
adapter speed 1000
init
# BIST restoration uses RMW bit3 only; original register 0x4b400001
set control [lindex [read_memory 0x58005048 32 1] 0]
write_memory 0x58005048 32 [list [expr {($control & ~0x00000008) | 0x00000000}]]
echo "RESTORED_DSI [bes.mem mdw 0x58005048 1]"
echo "RESTORED_BIST [bes.mem mdw 0x58005048 1]"
shutdown
