# Authorized RAM test round 02, after fresh read-only preflight validation.
source [find swd-memory.cfg]
adapter speed 1000
init
set panel_identity_initialized [lindex [read_memory 0x3401d2c0 8 1] 0]
if {$panel_identity_initialized != 0} {
    echo "STOP: factory initialization state changed; re-evaluate"
} else {
    # Only these two data buffers are written. No flag, code, numeric DID cache,
    # Flash, CPU halt/reset, or target function call is part of this test.
    echo "DID_BUFFER [load_image backups/ram-identity-test-candidate/factory-did-buffer.bin 0x34000844 bin]"
    echo "KEY_BUFFER [load_image backups/ram-identity-test-candidate/factory-key-buffer.bin 0x34000870 bin]"
    dump_image backups/ram-identity-test-round02/post-did-buffer.bin 0x34000844 0x20
    dump_image backups/ram-identity-test-round02/post-key-buffer.bin 0x34000870 0x20
}
shutdown
