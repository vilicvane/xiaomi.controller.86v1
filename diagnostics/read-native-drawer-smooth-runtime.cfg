# Generic MEM-AP reads only; no halt, reset, native calls or target writes.
source [find swd-memory.cfg]
adapter speed 1000
init
set context [lindex [read_memory 0x384fc864 32 1] 0]
echo "NATIVE_DRAWER_SMOOTH_CONTEXT $context"
if {$context>=0x38000000 && $context<0x39000000 && ($context&3)==0} {
    # Context 176 bytes; animation_from +164, pending +168, phase +172.
    echo "NATIVE_DRAWER_SMOOTH_FIELDS [read_memory $context 32 44]"
}
echo "NATIVE_DRAWER_SMOOTH_TIMER [read_memory 0x384fce54 32 2]"
echo "NATIVE_DRAWER_SMOOTH_FRAME_QUEUE [read_memory 0x384ef93c 32 1]"
shutdown
