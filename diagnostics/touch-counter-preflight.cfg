# Read-only known A7 display and physical input metadata. No core/Flash writes.
source [find swd-memory.cfg]
adapter speed 1000
init
proc tc_word {address} { return [expr {[lindex [read_memory $address 32 1] 0]+0}] }
proc tc_ptr {value} {
    if {$value < 0x38000000 || $value >= 0x39efffc0 || ($value & 3)} { error "Unexpected A7 NC memory pointer" }
    return $value
}
echo "TC_MCU [read_memory 0xe000edf0 32 1]"
echo "TC_SCANOUT [read_memory 0x581000f4 32 6]"
echo "TC_PHYSICAL_STATIC [read_memory 0x384f50a0 8 16]"
set tc_upper [tc_ptr [tc_word 0x384f50b0]]
echo [format "TC_UPPER 0x%08x" $tc_upper]
echo "TC_UPPER_HEADER [read_memory $tc_upper 32 8]"
if {[tc_word [expr {$tc_upper+0x1c}]] != 0x384f50ac || ([tc_word $tc_upper] & 255) != 8} { error "Physical upper half differs" }
set tc_sentinel [expr {$tc_upper+0x14}]
set tc_node [tc_word $tc_sentinel]
for {set tc_i 0} {$tc_i < 4 && $tc_node != $tc_sentinel} {incr tc_i} {
    tc_ptr $tc_node
    set tc_sub [expr {$tc_node-0x14}]
    set tc_header [read_memory $tc_sub 32 7]
    echo [format "TC_SUB %d 0x%08x %s" $tc_i $tc_sub $tc_header]
    set tc_buffer [tc_ptr [expr {[lindex $tc_header 0]+0}]]
    if {[expr {[lindex $tc_header 1]+0}] != 256} { error "Unexpected input ring size" }
    echo "TC_RING_$tc_i [read_memory $tc_buffer 32 64]"
    set tc_node [expr {[lindex $tc_header 5]+0}]
}
if {$tc_node != $tc_sentinel} { error "Unexpected long physical subscriber list" }
shutdown
