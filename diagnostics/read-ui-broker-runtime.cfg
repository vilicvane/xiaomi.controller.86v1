# Only generic MEM-AP reads. Does not halt, resume, reset or call target code.
source [find swd-memory.cfg]
adapter speed 1000
init
set context [lindex [read_memory 0x384fc864 32 1] 0]
echo "UI_BROKER_CONTEXT $context"
if {$context>=0x38000000 && $context<0x39000000 && ($context&3)==0} {
    echo "UI_BROKER_FIELDS [read_memory $context 32 26]"
}
echo "UI_BROKER_TIMER [read_memory 0x384fce54 32 2]"
echo "UI_BROKER_FRAME_SLOTS [read_memory 0x384ef854 32 1] [read_memory 0x384ef87c 32 1]"
echo "UI_BROKER_GPIO [read_memory 0x40081050 32 1]"
echo "UI_BROKER_FRAME_QUEUE [read_memory 0x384ef93c 32 1]"
shutdown
