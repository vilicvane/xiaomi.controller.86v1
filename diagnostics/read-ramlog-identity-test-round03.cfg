source [find swd-memory.cfg]
adapter speed 1000
init
# Observe the authorized RAM identity test. Only reads in this config.
dump_image backups/ram-identity-test-round03/observe-did-buffer.bin 0x34000844 0x20
dump_image backups/ram-identity-test-round03/observe-key-buffer.bin 0x34000870 0x20
dump_image backups/ram-identity-test-round03/observe-init-flag.bin 0x3401d2c0 0x4
dump_image backups/ram-identity-test-round03/ramlog-metadata-before.bin 0x34000384 0x30
echo "RAMLOG [dump_image backups/ram-identity-test-round03/ramlog-buffer-128k.bin 0x200d5e00 0x20000]"
dump_image backups/ram-identity-test-round03/ramlog-metadata-after.bin 0x34000384 0x30
shutdown
