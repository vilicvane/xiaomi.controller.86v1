source [find swd-memory.cfg]
adapter speed 1000
init
set panel_inode_addr [lindex [read_memory 0x3401a65c 32 1] 0]
set panel_inode_seen {}
for {set panel_inode_index 0} {$panel_inode_addr != 0 && $panel_inode_index < 24} {incr panel_inode_index} {
    # Follow only validated RAM pointers, never peripheral address space.
    if {!(($panel_inode_addr >= 0x34000000 && $panel_inode_addr <= 0x347fffc0) || ($panel_inode_addr >= 0x20000000 && $panel_inode_addr <= 0x2016cfc0)) || ($panel_inode_addr & 3) != 0} {
        echo "INODE_STOP invalid RAM pointer"
        break
    }
    if {[lsearch -exact $panel_inode_seen $panel_inode_addr] >= 0} {
        echo "INODE_STOP repeated pointer"
        break
    }
    lappend panel_inode_seen $panel_inode_addr
    set panel_inode_header [read_memory $panel_inode_addr 32 3]
    echo "INODE_NODE index=$panel_inode_index address=$panel_inode_addr"
    dump_image backups/inode-top-level-read02-$panel_inode_index.bin $panel_inode_addr 0x40
    set panel_inode_addr [lindex $panel_inode_header 1]
}
shutdown
