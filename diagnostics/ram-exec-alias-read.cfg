# Read-only validation of noncached PSRAM data/instruction aliases and SAU.
source [find swd-memory.cfg]
adapter speed 1000
init
echo "SAU_CTRL_TYPE [bes.mem mdw 0xe000edd0 2]"
echo "ALIAS_DATA [dump_image backups/ram-execution/alias-data-before.bin 0x301c9c80 0x40]"
echo "ALIAS_CODE [dump_image backups/ram-execution/alias-code-before.bin 0x101c9c80 0x40]"
shutdown
