# Debug-port and access-port discovery only. No CPU target or Flash driver.
# OpenOCD init performs the normal debug power handshake and clears sticky
# debug-port errors. It does not request CPU reset/halt or program memory.
source [find interface/cmsis-dap.cfg]
cmsis-dap backend hid
transport select swd
adapter speed 10
reset_config none
swd newdap bes dp -expected-id 0x1be12aeb
dap create bes.dap -chain-position bes.dp
