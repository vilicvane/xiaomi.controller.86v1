# Bounded generic MEM-AP sampling only. No halt/reset/writes/native calls.
source [find swd-memory.cfg]
adapter speed 1000
init
set ctx [lindex [read_memory 0x384fc864 32 1] 0]
if {$ctx<0x38000000 || $ctx>=0x39000000 || ($ctx&3)!=0} {error "Invalid drawer context"}
echo "DRAWER_TIMING_CONTEXT $ctx"
sleep 3000
for {set n 0} {$n<1000} {incr n} {
    echo "DRAWER_TIMING $n [read_memory $ctx 32 42] Q [read_memory 0x384ef93c 32 1]"
    sleep 10
}
shutdown
