# Read-only UI sample collection on this installed 1.50.10 GitHub tap variant.
# No halt, reset, native calls, code or register writes.
source [find swd-memory.cfg]
adapter speed 1000
init
set context [lindex [read_memory 0x384fc864 32 1] 0]
if {$context<0x38000000 || $context>=0x39000000 || ($context&3)} { error "Unexpected UI context" }
set stop_at [expr {[clock milliseconds]+60000}]
set sample 0
while {[clock milliseconds]<$stop_at} {
    echo "TAP_FEEDBACK_SAMPLE $sample [clock milliseconds] [read_memory $context 32 46]"
    echo "TAP_FEEDBACK_QUEUE $sample [read_memory 0x384ef93c 32 1]"
    echo "TAP_FEEDBACK_PHYSICAL $sample [read_memory 0x384f50a1 8 1]"
    incr sample
    sleep 15
}
echo "TAP_FEEDBACK_SAMPLES $sample"
shutdown
