# Read-only generic MEM-AP; no CPU transfers, halt, reset or native call.
source [find swd-memory.cfg]
adapter speed 1000
init
echo "NATIVE_GITHUB_TAP_MCU_DHCSR [read_memory 0xe000edf0 32 1]"
echo "NATIVE_GITHUB_TAP_MCU_DEMCR [read_memory 0xe000edfc 32 1]"
echo "NATIVE_GITHUB_TAP_MCU_FAULT [read_memory 0xe000ed28 32 2]"
echo "NATIVE_GITHUB_TAP_FPBCOMP0 [read_memory 0xe0002008 32 1]"
echo "NATIVE_GITHUB_TAP_ENTRY [read_memory 0x28ccdcc8 32 1]"
echo "NATIVE_GITHUB_TAP_SHOWLOGO_ENTRY [read_memory 0x28ccdf20 32 1]"
echo "NATIVE_GITHUB_TAP_FACLVGL_ENTRY [read_memory 0x28ccdebc 32 1]"
echo "NATIVE_GITHUB_TAP_NTPCSTATUS_ENTRY [read_memory 0x28ccde80 32 1]"
echo "NATIVE_GITHUB_TAP_WIFI_RECORDER_ENTRY [read_memory 0x28ccdd2c 32 1]"
echo "NATIVE_GITHUB_TAP_CODE [read_memory 0x2892b10c 8 16]"
echo "NATIVE_GITHUB_TAP_FB_INIT [read_memory 0x38641232 8 1]"
echo "NATIVE_GITHUB_TAP_FB_OBJECT [read_memory 0x384ef84c 32 30]"
echo "NATIVE_GITHUB_TAP_CONTEXT [read_memory 0x384fc864 32 1]"
dump_image analysis/persistence/native-github-tap-live-code-sector.bin 0x2892b000 4096
dump_image analysis/persistence/native-github-tap-live-entry-sector.bin 0x28ccd000 4096
dump_image analysis/persistence/native-github-tap-live-aux-sector.bin 0x2895a000 4096
shutdown
