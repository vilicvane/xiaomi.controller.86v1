# RAM pixels only; physical input metadata is read-only. No CPU halt or injection.
source [find swd-memory.cfg]
adapter speed 1000
init
proc tc_rows {base first rows words} {
    if {$base != 0x38515040 && $base != 0x385ab140} { error "Unexpected scanout slot" }
    if {$first < 0 || $rows < 1 || $rows > 8 || $first+$rows > 280 || [llength $words] != $rows*32} { error "Pixel rectangle exceeds fixed bounds" }
    # Software/OS locks remain set: sticky historical PU/PD bits do not clear.
    # Gate live power/reset/halt/double-lock, then geometry BEFORE each batch.
    set power [expr {[lindex [read_memory 0x58050314 32 1] 0]+0}]
    set geometry [read_memory 0x581000f4 32 6]
    if {($power & 1) == 0 || ($power & 0x54) ||
        ([lindex $geometry 0] != 0x38515040 && [lindex $geometry 0] != 0x385ab140) ||
        [lindex $geometry 2] != 1280 || [lindex $geometry 4] != 0x01e00140 || [lindex $geometry 5] != 0x01e00140 ||
        ([lindex [read_memory 0x58100264 32 1] 0] & 0xfff) != 0x401} { error "PIXEL_EPOCH_OR_GEOMETRY_CHANGED" }
    for {set row 0} {$row < $rows} {incr row} {
        set offset [expr {(100+$first+$row)*1280+144*4}]
        write_memory [expr {$base+$offset}] 32 [lrange $words [expr {$row*32}] [expr {$row*32+31}]]
    }
    return "OK"
}
echo "TOUCH_COUNTER_MEMAP_SERVER_READY"
proc tc_read_rows {base first rows} {
    if {($base != 0x38515040 && $base != 0x385ab140) || $first < 0 || $rows < 1 || $rows > 8 || $first+$rows > 280} { error "Unexpected pixel read rectangle" }
    set result {}
    for {set row 0} {$row < $rows} {incr row} {
        set address [expr {$base+(100+$first+$row)*1280+144*4}]
        set result [concat $result [read_memory $address 32 32]]
    }
    return $result
}
