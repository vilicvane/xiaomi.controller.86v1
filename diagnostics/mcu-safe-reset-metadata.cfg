source [find swd-memory.cfg]
adapter speed 1000
init
echo "DHCSR [bes.mem mdw 0xe000edf0 1]"
echo "MAIN_NOR_CONTEXT [bes.mem mdw 0x2000417c 9]"
echo "MAIN_CONTROLLER_POINTER [bes.mem mdw 0x20003948 2]"
echo "MAIN_NOR_SUSPEND [bes.mem mdw 0x200041f4 1]"
