# Root-owned execution only. Prepared offline; generic MEM-AP, no Cortex-M examine.
# One AIRCR SYSRESETREQ, reset vector catch, then one FPB v2 breakpoint at boot
# 0x0c0104c6. No NOR data/RAM/core-register modification; DCRSR read transfers
# overwrite DCRDR temporarily and restore its freshly halted value.
# A reset intentionally discards the old application execution context.
# This is a warm system-reset experiment, NOT proof of full-power cold recovery.
if {![info exists boot_result_path]} { set boot_result_path "diagnostics/mcu-reset-bootbreak-result.txt" }
set boot_result [open $boot_result_path w]
set boot_begin_ms [clock milliseconds]
set boot_saved 0
set boot_control_possible 0
set boot_catch_possible 0
set boot_reset_possible 0
set boot_fp_possible 0
set boot_fpen_possible 0
set boot_dcrdr_possible 0
set boot_post_fp_saved 0
set boot_halted_dcrdr_saved 0
set boot_reset_seen 0
set boot_track_reset 0
set boot_unexpected_reset 0
set boot_reset_caught 0
set boot_break_hit 0
set boot_resumed 0
set boot_cleanup_complete 0
set boot_write_count 0
set boot_phase "preflight"
proc boot_log {message} { global boot_result; puts $boot_result $message }
proc boot_word {address} {
    global boot_track_reset boot_reset_seen boot_unexpected_reset
    set value [expr {[lindex [read_memory $address 32 1] 0] + 0}]
    if {$address == 0xe000edf0 && ($value & 0x02000000)} {
        if {$boot_track_reset == 1} { set boot_reset_seen 1 }
        if {$boot_track_reset == 2} { set boot_unexpected_reset 1 }
    }
    return $value
}
proc boot_put {address value flag} {
    global boot_write_count
    upvar #0 $flag possible
    set possible 1
    incr boot_write_count
    boot_log [format "write_possible_%02d 0x%08x 0x%08x" $boot_write_count $address $value]
    write_memory $address 32 [list $value]
}
proc boot_wait_halt {timeout_ms tolerate_ap_errors} {
    set begin [clock milliseconds]
    for {set i 0} {$i < 160} {incr i} {
        set failed [catch { set status [boot_word 0xe000edf0] } message]
        if {!$failed && ($status & 0x20000)} { return $status }
        if {$failed && !$tolerate_ap_errors} { error $message }
        if {[clock milliseconds] - $begin >= $timeout_ms} { break }
        sleep 5
    }
    error "Halt not observed within bounded poll"
}
proc boot_wait_reset_catch {timeout_ms} {
    global boot_reset_seen
    set begin [clock milliseconds]
    for {set i 0} {$i < 200} {incr i} {
        # SYSRESETREQ can be posted while the old C_HALT remains visible.
        # Do not mistake that pre-reset halt for the new vector catch.
        set failed [catch {
            set status [boot_word 0xe000edf0]
            set dfsr [boot_word 0xe000ed30]
        } message]
        if {!$failed && $boot_reset_seen && ($status & 0x20001) == 0x20001 && ($dfsr & 8)} {
            boot_log [format "reset_catch_joint_status 0x%08x dfsr 0x%08x" $status $dfsr]
            return $status
        }
        if {[clock milliseconds] - $begin >= $timeout_ms} { break }
        sleep 5
    }
    if {[info exists status] && [info exists dfsr]} {
        boot_log [format "reset_catch_timeout_status 0x%08x dfsr 0x%08x reset_seen %d" $status $dfsr $boot_reset_seen]
    }
    error "Joint reset event and fresh vector catch not observed within bounded poll"
}
proc boot_stable_halt {} {
    global boot_unexpected_reset
    set status [boot_word 0xe000edf0]
    if {$boot_unexpected_reset || ($status & 0x20001) != 0x20001} {
        error "Fresh halted context lost or unexpected later reset"
    }
    return $status
}
proc boot_core_read {selector} {
    boot_stable_halt
    boot_put 0xe000edf4 $selector boot_dcrdr_possible
    for {set i 0} {$i < 80} {incr i} {
        set status [boot_stable_halt]
        if {$status & 0x10000} { return [boot_word 0xe000edf8] }
    }
    error "DCRSR read transfer timeout"
}
proc boot_fpb_snapshot {prefix} {
    set ctrl [boot_word 0xe0002000]
    set rev [expr {($ctrl >> 28) & 15}]
    set code [expr {(($ctrl >> 8) & 0x70) | (($ctrl >> 4) & 15)}]
    set lit [expr {($ctrl >> 8) & 15}]
    boot_log [format "%s_fpctrl 0x%08x revision %d code %d literal %d" $prefix $ctrl $rev $code $lit]
    # This concrete STAR-MC1 view was observed by root, not inferred from CPUID.
    if {$rev != 1 || $code != 8 || $lit != 0} { error "FPB differs from observed v2/eight-code-comparator layout" }
    set values [read_memory 0xe0002008 32 $code]
    foreach value $values {
        if {$value != 0} { error "Existing FPB comparator configuration; preserve without reset experiment" }
    }
    boot_log "${prefix}_comparators_zero 8"
    return $ctrl
}
proc boot_remove_catch {} {
    global boot_original_demcr
    set current [boot_word 0xe000edfc]
    set desired [expr {($current & ~1) | ($boot_original_demcr & 1)}]
    boot_put 0xe000edfc $desired boot_catch_possible
    if {([boot_word 0xe000edfc] & 1) != ($boot_original_demcr & 1)} {
        error "Reset catch restoration failed"
    }
}
proc boot_remove_fpb {} {
    global boot_fp_possible boot_fpen_possible boot_post_fp_saved boot_post_fpctrl
    if {$boot_fp_possible} {
        boot_put 0xe0002008 0 boot_fp_possible
        if {[boot_word 0xe0002008] != 0} { error "Temporary comparator removal failed" }
    }
    if {$boot_fpen_possible && $boot_post_fp_saved} {
        boot_put 0xe0002000 [expr {2 | ($boot_post_fpctrl & 1)}] boot_fpen_possible
        if {([boot_word 0xe0002000] & 1) != ($boot_post_fpctrl & 1)} { error "FPB enable restoration failed" }
    }
}
boot_log "scope one SYSRESETREQ, reset catch, FPB boot breakpoint, immediate resume; no NOR/RAM/core-register data writes"
set boot_test_error [catch {
    source [find swd-memory.cfg]
    adapter speed 1000
    init
    set boot_cpuid [boot_word 0xe000ed00]
    set boot_original_dhcsr [boot_word 0xe000edf0]
    set boot_original_demcr [boot_word 0xe000edfc]
    set boot_original_aircr [boot_word 0xe000ed0c]
    set boot_original_dfsr [boot_word 0xe000ed30]
    set boot_original_dscsr [boot_word 0xe000ee08]
    set boot_auth [boot_word 0xe000efb8]
    set boot_pre_fpctrl [boot_fpb_snapshot pre]
    foreach name {cpuid original_dhcsr original_demcr original_aircr original_dfsr original_dscsr auth} {
        boot_log [format "%s 0x%08x" $name [set boot_$name]]
    }
    if {$boot_cpuid != 0x630f1321} { error "CPUID differs from reviewed STAR-MC1" }
    if {($boot_original_dhcsr & 0x20000) || (($boot_original_dhcsr & 1) && ($boot_original_dhcsr & 0xfffe))} {
        error "Existing halt or active unexpected debug controls; preserve state"
    }
    if {($boot_original_dhcsr & 0x100000) == 0 || ($boot_original_dhcsr & 0x600000)} {
        error "Full Secure invasive debug not allowed"
    }
    if {$boot_original_demcr & 1} { error "Reset vector catch already owned by another actor" }
    if {($boot_original_aircr & 0xffff0000) != 0xfa050000} { error "AIRCR key/status view differs" }
    if {[boot_word 0x0c0104c4] != 0xf006f895 || [boot_word 0x0c0104c8] != 0x4b5bf887} {
        error "Boot breakpoint instructions differ from reviewed original boot"
    }
    set boot_saved 1
    # Enabling debug requires MASKINTS=0. Never SNAPSTALL/STEP/mask IRQs.
    boot_put 0xe000edf0 0xa05f0001 boot_control_possible
    boot_put 0xe000edf0 0xa05f0003 boot_control_possible
    boot_wait_halt 200 0
    # Record then W1C only the two event flags owned by this probe.
    boot_log [format "pre_reset_dfsr 0x%08x" [boot_word 0xe000ed30]]
    boot_put 0xe000ed30 0x0a boot_control_possible
    boot_put 0xe000edfc [expr {$boot_original_demcr | 1}] boot_catch_possible
    if {([boot_word 0xe000edfc] & 1) == 0} { error "Reset vector catch write ignored" }
    # Acknowledge history before opening the intentional-reset epoch.
    boot_word 0xe000edf0
    set boot_track_reset 1
    set boot_phase "reset_requested"
    # Preserve RW configuration, exclude RO endianness/reserved/action bits.
    set boot_reset_value [expr {0x05fa0004 | ($boot_original_aircr & 0x6738)}]
    # AP may report an error after the reset write has committed. Poll anyway.
    set reset_write_error [catch { boot_put 0xe000ed0c $boot_reset_value boot_reset_possible } reset_write_message]
    boot_log "reset_write_transport_error $reset_write_error"
    set boot_caught_status [boot_wait_reset_catch 1000]
    set boot_caught_dfsr [boot_word 0xe000ed30]
    if {!$boot_reset_seen || ($boot_caught_status & 0x20001) != 0x20001 || ($boot_caught_dfsr & 8) == 0} {
        error "Intentional reset and fresh reset-vector catch were not jointly verified"
    }
    # An additional read must acknowledge S_RESET_ST before later-reset tracking.
    set boot_post_baseline [boot_word 0xe000edf0]
    if {$boot_post_baseline & 0x02000000} { error "Reset remains asserted/repeating at reset catch" }
    set boot_track_reset 2
    set boot_phase "reset_caught"
    set boot_reset_caught 1
    set boot_halted_dcrdr [boot_word 0xe000edf8]
    set boot_halted_dcrdr_saved 1
    set boot_reset_pc [boot_core_read 15]
    set boot_reset_xpsr [boot_core_read 16]
    set boot_reset_sp [boot_core_read 13]
    set boot_reset_dscsr [boot_word 0xe000ee08]
    boot_log [format "reset_catch_pc 0x%08x sp 0x%08x xpsr 0x%08x dscsr 0x%08x dhcsr 0x%08x dfsr 0x%08x" $boot_reset_pc $boot_reset_sp $boot_reset_xpsr $boot_reset_dscsr $boot_caught_status $boot_caught_dfsr]
    # BootROM can run before Secure invasive debug becomes available. Never claim
    # main-independence when reset catch has already arrived at main/recovery.
    # Public BEST2003 ROM_BASE=0x20000, max ROM_SIZE=0x20000.
    # The reviewed original boot reset entry is exactly 0x0c000010.
    if {$boot_reset_pc != 0x0c000010 && !($boot_reset_pc >= 0x00020000 && $boot_reset_pc < 0x00040000)} {
        error "Reset catch PC is outside BootROM/original boot allowlist"
    }
    if {($boot_reset_xpsr & 0x1ff) != 0 || ($boot_reset_dscsr & 0x10000) == 0} {
        error "Reset catch PC/security/Thread state is not an accepted boot start"
    }
    set boot_post_fpctrl [boot_fpb_snapshot post_reset]
    set boot_post_fp_saved 1
    # Install only after reset catch: no assumption that FPB survived reset.
    boot_put 0xe0002008 0x0c0104c7 boot_fp_possible
    if {[boot_word 0xe0002008] != 0x0c0104c7} { error "Boot comparator write/readback failed" }
    if {($boot_post_fpctrl & 1) == 0} { boot_put 0xe0002000 3 boot_fpen_possible }
    if {([boot_word 0xe0002000] & 1) == 0} { error "FPB enable failed" }
    boot_remove_catch
    boot_put 0xe000ed30 0x0a boot_control_possible
    boot_put 0xe000edf8 $boot_halted_dcrdr boot_dcrdr_possible
    set boot_halted_dcrdr_saved 0
    boot_stable_halt
    set boot_phase "boot_running"
    boot_put 0xe000edf0 0xa05f0001 boot_control_possible
    set boot_hit_status [boot_wait_halt 2000 0]
    boot_stable_halt
    set boot_hit_dfsr [boot_word 0xe000ed30]
    set boot_halted_dcrdr [boot_word 0xe000edf8]
    set boot_halted_dcrdr_saved 1
    set boot_hit_pc [boot_core_read 15]
    set boot_hit_sp [boot_core_read 13]
    set boot_hit_xpsr [boot_core_read 16]
    set boot_hit_msplim [boot_core_read 28]
    set boot_hit_dscsr [boot_word 0xe000ee08]
    boot_log [format "boot_stop_pc 0x%08x sp 0x%08x msplim_s 0x%08x xpsr 0x%08x dscsr 0x%08x dhcsr 0x%08x dfsr 0x%08x" $boot_hit_pc $boot_hit_sp $boot_hit_msplim $boot_hit_xpsr $boot_hit_dscsr $boot_hit_status $boot_hit_dfsr]
    if {$boot_hit_pc != 0x0c0104c6 || ($boot_hit_dfsr & 2) == 0 || ($boot_hit_xpsr & 0x1ff) != 0 || ($boot_hit_dscsr & 0x10000) == 0} {
        error "Halt was not the reviewed Secure Thread boot breakpoint"
    }
    if {$boot_hit_msplim != 0x200d3e00 || $boot_hit_sp <= $boot_hit_msplim || $boot_hit_sp > 0x200d5e00} {
        error "Boot stack ownership differs from original boot"
    }
    set boot_context [read_memory 0x20003ae0 32 9]
    boot_log "boot_nor_context_words $boot_context"
    set boot_first_context [expr {[lindex $boot_context 0] + 0}]
    if {($boot_first_context & 255) != 1} { error "Independent boot NOR context is not opened" }
    # This probe only observes boot context; no NOR API is invoked.
    set boot_break_hit 1
    set boot_phase "boot_break_hit"
} boot_test_message]

# Finally: remove temporary debug mechanisms and continue original firmware.
# Never replay pre-reset RAM/PC/SP/registers. Transport failure can follow a
# committed write, so every possible-write flag is set before the write.
set boot_cleanup_error [catch {
    if {$boot_saved && ($boot_control_possible || $boot_catch_possible || $boot_fp_possible)} {
        set current [boot_word 0xe000edf0]
        if {$boot_unexpected_reset} { boot_log "cleanup_note unexpected later reset; no stale core context restored" }
        if {$boot_fp_possible || $boot_fpen_possible} { boot_remove_fpb }
        if {$boot_catch_possible} { boot_remove_catch }
        if {$boot_halted_dcrdr_saved && $boot_dcrdr_possible} {
            if {!$boot_unexpected_reset && ($current & 0x20000)} {
                boot_put 0xe000edf8 $boot_halted_dcrdr boot_dcrdr_possible
            } else { boot_log "cleanup_note DCRDR snapshot discarded after reset/lost halt" }
        }
        # No CPU-register writes occurred, so clearing our halt continues the
        # fresh, current instruction stream, including after an intended reset.
        # Restore only original C_DEBUGEN; the original state was running with
        # no meaningful STEP/MASK/HALT/SNAPSTALL controls.
        boot_put 0xe000edf0 [expr {0xa05f0000 | ($boot_original_dhcsr & 1)}] boot_control_possible
        set begin [clock milliseconds]
        for {set i 0} {$i < 80} {incr i} {
            set current [boot_word 0xe000edf0]
            if {($current & 0x20000) == 0 && ($current & 1) == ($boot_original_dhcsr & 1)} { set boot_resumed 1; break }
            if {[clock milliseconds] - $begin >= 250} { break }
            sleep 5
        }
        if {!$boot_resumed} { error "Original-firmware continuation was not confirmed" }
        if {$boot_fp_possible && [boot_word 0xe0002008] != 0} { error "Temporary comparator still present" }
        if {([boot_word 0xe000edfc] & 1) != ($boot_original_demcr & 1)} { error "Temporary reset catch still present" }
        boot_log [format "final_dhcsr 0x%08x final_demcr 0x%08x final_fpctrl 0x%08x" $current [boot_word 0xe000edfc] [boot_word 0xe0002000]]
    }
    set boot_cleanup_complete 1
} boot_cleanup_message]
foreach name {reset_possible reset_seen reset_caught break_hit unexpected_reset resumed cleanup_complete write_count phase} {
    boot_log "$name [set boot_$name]"
}
if {$boot_test_error} { boot_log "test_error $boot_test_message" }
if {$boot_cleanup_error} { boot_log "cleanup_error $boot_cleanup_message" }
close $boot_result
if {$boot_test_error || $boot_cleanup_error} { error "MCU boot-break probe failed; inspect result and cleanup status" }
echo "Verified reset catch and boot breakpoint; original firmware resumed; no NOR data write"
shutdown
