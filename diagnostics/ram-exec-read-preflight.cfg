# Read-only core/debug configuration probe. No CPU control or memory writes.
source [find swd-memory.cfg]
adapter speed 1000
init
echo "CPUID [bes.mem mdw 0xe000ed00 1]"
echo "ICSR_VTOR_AIRCR [bes.mem mdw 0xe000ed04 3]"
echo "FAULT_STATUS [bes.mem mdw 0xe000ed24 4]"
echo "CPACR [bes.mem mdw 0xe000ed88 1]"
echo "MPU_TYPE_CTRL [bes.mem mdw 0xe000ed90 2]"
echo "DEBUG [bes.mem mdw 0xe000edf0 4]"
echo "DSCSR [bes.mem mdw 0xe000ee08 1]"
shutdown
