# Read-only live 1.50.10 UI object/ABI validation. No halt/reset/native call.
source [find swd-memory.cfg]
adapter speed 1000
init
proc ui_word {address} { return [lindex [read_memory $address 32 1] 0] }
proc ui_pointer {value} { return [expr {$value >= 0x38000000 && $value < 0x39000000 && ($value&3)==0}] }
echo "STOCK_FB [read_memory 0x384ef84c 32 31]"
echo "STOCK_TIMER [read_memory 0x384fce20 32 17]"
echo "STOCK_INPUT_LIST [read_memory 0x384fcbd8 32 3]"
echo "STOCK_DISPLAY_LIST [read_memory 0x384fcc48 32 3]"
set display [ui_word 0x384fcc4c]
if {[ui_pointer $display]} {
    set driver [ui_word $display]
    if {[ui_pointer $driver]} {
        set board [expr {$driver-0x1c}]
        echo "STOCK_DISPLAY_DRIVER $driver BOARD $board"
        echo "STOCK_BOARD_FB [read_memory [expr {$board+0x2a0}] 32 13]"
    }
}
set node [ui_word 0x384fcbdc]
for {set i 0} {$i<4 && [ui_pointer $node]} {incr i} {
    set driver [ui_word $node]
    echo "STOCK_INPUT_NODE $i $node DRIVER $driver"
    if {[ui_pointer $driver]} {
        echo "STOCK_INPUT_DRIVER [read_memory $driver 32 5]"
        set userdata [ui_word [expr {$driver+0xc}]]
        if {[ui_pointer $userdata]} { echo "STOCK_INPUT_USERDATA [read_memory $userdata 32 2]" }
    }
    set node [ui_word [expr {$node+0x84}]]
}
shutdown
