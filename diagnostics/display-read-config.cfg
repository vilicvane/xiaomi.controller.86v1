# Read-only display configuration/object capture; omit FIFO/data ports.
source [find swd-memory.cfg]
adapter speed 1000
init
dump_image backups/display-takeover/lcdc-plane-config.bin 0x581000c0 0x80
dump_image backups/display-takeover/lcdc-dma-control.bin 0x58100190 0x20
dump_image backups/display-takeover/lcdc-tv-plane-config.bin 0x58100000 0x50
dump_image backups/display-takeover/lcdc-tv-control.bin 0x58100080 0x20
dump_image backups/display-takeover/dsi-config.bin 0x58005000 0x28
dump_image backups/display-takeover/a7-fb-object.bin 0x384ef84c 0x104
shutdown
