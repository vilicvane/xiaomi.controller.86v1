# Named read-only LCDC configuration and identified Cortex-A7 component status.
source [find swd-memory.cfg]
adapter speed 1000
init
echo "LCDC_COLOR [bes.mem mdw 0x58100124 1]"
echo "LCDC_260_264 [bes.mem mdw 0x58100260 2]"
echo "A7_DIDR [bes.mem mdw 0x58050000 1]"
echo "A7_MIDR [bes.mem mdw 0x58050d00 1]"
echo "A7_OSLSR [bes.mem mdw 0x58050304 1]"
echo "A7_AUTH [bes.mem mdw 0x58050fb8 1]"
echo "A7_DSCR_FIRST [bes.mem mdw 0x58050088 1]"
echo "A7_PRSR_FIRST [bes.mem mdw 0x58050314 1]"
echo "A7_DEBUG_SIGNALS [bes.mem mdw 0x40000140 1]"
shutdown
