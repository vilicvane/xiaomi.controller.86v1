# Generic MEM-AP only. Read DCRDR FIRST; never transfer CPU registers via DCRSR.
source [find swd-memory.cfg]
adapter speed 1000
init
set hook_marker [expr {[lindex [read_memory 0xe000edf8 32 1] 0]+0}]
echo [format "FIRST_DCRDR 0x%08x" $hook_marker]
echo "HOOK_MCU_DHCSR_DEMCR [bes.mem mdw 0xe000edf0 4]"
echo "HOOK_MCU_FAULT [bes.mem mdw 0xe000ed28 2]"
echo "HOOK_ENTRY_BYTES [read_memory 0x28150056 8 4]"
echo "HOOK_PAYLOAD_BYTES [read_memory 0x28824400 8 32]"
shutdown
