source [find swd-memory.cfg]
adapter speed 1000
init
set panel_controller_table [read_memory 0x20003948 32 2]
if {[expr {[lindex $panel_controller_table 0]+0}] != 0x40148000 || [expr {[lindex $panel_controller_table 1]+0}] != 0x40140000} {
    error "Live main controller table differs from verified firmware; preserve state"
}
set panel_controller_base [expr {[lindex $panel_controller_table 0]+0}]
echo "ID0_SPI_BASE $panel_controller_base"
echo "ID0_SPI_STATUS [bes.mem mdw [expr {$panel_controller_base+0x0c}] 1]"
echo "ID0_SPI_LOCK [bes.mem mdw [expr {$panel_controller_base+0x34}] 1]"
shutdown
