# Read-only generic MEM-AP; no CPU transfers, halt, reset or native call.
source [find swd-memory.cfg]
adapter speed 1000
init
echo "NATIVE_UI_BROKER_MCU_DHCSR [read_memory 0xe000edf0 32 1]"
echo "NATIVE_UI_BROKER_MCU_DEMCR [read_memory 0xe000edfc 32 1]"
echo "NATIVE_UI_BROKER_MCU_FAULT [read_memory 0xe000ed28 32 2]"
echo "NATIVE_UI_BROKER_FPBCOMP0 [read_memory 0xe0002008 32 1]"
echo "NATIVE_UI_BROKER_ENTRY [read_memory 0x28ccdcc8 32 1]"
echo "NATIVE_UI_BROKER_SHOWLOGO_ENTRY [read_memory 0x28ccdf20 32 1]"
echo "NATIVE_UI_BROKER_FACLVGL_ENTRY [read_memory 0x28ccdebc 32 1]"
echo "NATIVE_UI_BROKER_NTPCSTATUS_ENTRY [read_memory 0x28ccde80 32 1]"
echo "NATIVE_UI_BROKER_CODE [read_memory 0x2892b10c 8 16]"
echo "NATIVE_UI_BROKER_FB_INIT [read_memory 0x38641232 8 1]"
echo "NATIVE_UI_BROKER_FB_OBJECT [read_memory 0x384ef84c 32 30]"
echo "NATIVE_UI_BROKER_CONTEXT [read_memory 0x384fc864 32 1]"
dump_image analysis/display-takeover/native-ui-broker-live-code-sector.bin 0x2892b000 4096
dump_image analysis/display-takeover/native-ui-broker-live-entry-sector.bin 0x28ccd000 4096
shutdown
