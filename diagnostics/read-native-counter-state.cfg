# Generic MEM-AP only; no CPU register transfers, target halt, or reset.
source [find swd-memory.cfg]
adapter speed 1000
init
echo "NATIVE_COUNTER_MCU_DHCSR [read_memory 0xe000edf0 32 1]"
echo "NATIVE_COUNTER_MCU_DEMCR [read_memory 0xe000edfc 32 1]"
echo "NATIVE_COUNTER_MCU_FAULT [read_memory 0xe000ed28 32 2]"
echo "NATIVE_COUNTER_FPBCOMP0 [read_memory 0xe0002008 32 1]"
echo "NATIVE_COUNTER_ENTRY [read_memory 0x28ccdcc8 32 1]"
echo "NATIVE_COUNTER_CODE [read_memory 0x2892b2f8 8 8]"
echo "NATIVE_COUNTER_FB_INIT [read_memory 0x38641232 8 1]"
echo "NATIVE_COUNTER_FB_OBJECT [read_memory 0x384ef84c 32 30]"
dump_image analysis/display-takeover/native-counter-live-code-sector.bin 0x2892b000 4096
dump_image analysis/display-takeover/native-counter-live-entry-sector.bin 0x28ccd000 4096
shutdown
