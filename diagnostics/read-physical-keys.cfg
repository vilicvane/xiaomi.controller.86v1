# Read-only GPIO sampling for entity-to-pin mapping. No halt/reset or writes.
source [find swd-memory.cfg]
adapter speed 1000
init
echo "PHYSICAL_KEYS_HAL_CALLBACK [read_memory 0x2007e734 32 1]"
echo "PHYSICAL_KEYS_PREV_A [read_memory 0x34053e28 32 1]"
echo "PHYSICAL_KEYS_PREV_B [read_memory 0x34059d7c 32 1]"
set key_previous -1
set key_changes 0
for {set key_tick 0} {$key_tick < 1200} {incr key_tick} {
    set key_word [lindex [read_memory 0x40081050 32 1] 0]
    set key_bits [expr {$key_word & 0x0e000000}]
    if {$key_bits != $key_previous} {
        echo [format "PHYSICAL_KEYS tick=%d raw=0x%08x selected=0x%08x" $key_tick $key_word $key_bits]
        set key_previous $key_bits
        incr key_changes
    }
    sleep 25
}
echo "PHYSICAL_KEYS_COMPLETE changes=$key_changes"
shutdown
