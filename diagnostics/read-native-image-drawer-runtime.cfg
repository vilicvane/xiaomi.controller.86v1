# Generic MEM-AP reads only; no halt, reset, native calls or target writes.
source [find swd-memory.cfg]
adapter speed 1000
init
set context [lindex [read_memory 0x384fc864 32 1] 0]
echo "NATIVE_IMAGE_DRAWER_CONTEXT $context"
if {$context>=0x38000000 && $context<0x39000000 && ($context&3)==0} {
    # Exact 212-byte context, 53 words; common drawer prefix is 176 bytes.
    # image +176, receive +180, image_pending +184, generation +188,
    # displayed_generation +192, server_state +196, server_error +200,
    # reserved/unused received +204 stays zero; ipv4 +208 is raw network bytes.
    # These slots do not use historical fast-tap feedback semantics.
    echo "NATIVE_IMAGE_DRAWER_FIELDS [read_memory $context 32 53]"
    echo "NATIVE_IMAGE_DRAWER_IPV4_BYTES [read_memory [expr {$context+208}] 8 4]"
}
echo "NATIVE_IMAGE_DRAWER_TIMER [read_memory 0x384fce54 32 2]"
echo "NATIVE_IMAGE_DRAWER_FRAME_QUEUE [read_memory 0x384ef93c 32 1]"
shutdown
