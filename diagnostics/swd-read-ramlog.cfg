source [find swd-memory.cfg]
adapter speed 1000
init
# Exact RAMLOG buffer pointer and size were recovered from the live g_sysdev.
# Read metadata before/after to record changes while the CPU continues running.
dump_image backups/ramlog-metadata-before.bin 0x34000384 0x30
echo "RAMLOG [dump_image backups/ramlog-buffer-128k.bin 0x200d5e00 0x20000]"
dump_image backups/ramlog-metadata-after.bin 0x34000384 0x30
shutdown
