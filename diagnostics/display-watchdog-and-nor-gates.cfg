source [find swd-memory.cfg]
adapter speed 1000
init
echo "A7_WDT_LOAD [bes.mem mdw 0x58001000 1]"
echo "A7_WDT_VALUE [bes.mem mdw 0x58001004 1]"
echo "A7_WDT_CTRL [bes.mem mdw 0x58001008 1]"
echo "A7_WDT_RIS [bes.mem mdw 0x58001010 1]"
echo "A7_WDT_MIS [bes.mem mdw 0x58001014 1]"
echo "NATIVE_CHIP_INDEX [bes.mem mdb 0x20004216 1]"
echo "CHIP_TABLE_INDEX15 [bes.mem mdw 0x20003db8 1]"
echo "CHIP_STATUS_CALLBACK [bes.mem mdw 0x20003f2c 1]"
