source [find swd-memory.cfg]
adapter speed 1000
init
# Bounded memory reads only. No target-memory writes, CPU halt, reset, or code execution.
# Cache/table and RAMLOG addresses were recovered from the actual firmware.
echo "FACTORY_CACHE [dump_image backups/identity-cache-read02.bin 0x340007b8 0x134]"
echo "FACTORY_INIT_FLAG [dump_image backups/identity-init-flag-read02.bin 0x3401d2c0 0x4]"
echo "CACHED_NUMERIC_DID [dump_image backups/identity-numeric-did-read02.bin 0x340529c0 0x8]"
dump_image backups/ramlog-metadata-before-read02.bin 0x34000384 0x30
echo "RAMLOG [dump_image backups/ramlog-buffer-128k-read02.bin 0x200d5e00 0x20000]"
dump_image backups/ramlog-metadata-after-read02.bin 0x34000384 0x30
shutdown
