source [find swd-memory.cfg]
adapter speed 1000
init
# Bounded memory reads only; no CPU halt/reset or target-memory writes.
# SRAM extent and PSRAM address are supported by BES2003 reference sources.
echo "SRAM_SNAPSHOT [dump_image backups/mi-panel-sram-20261003.bin 0x20000000 0xe0000]"
echo "PSRAM_SNAPSHOT [dump_image backups/mi-panel-psram-first1m-20261003.bin 0x34000000 0x100000]"
shutdown
